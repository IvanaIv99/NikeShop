<div class="tm-body">
  <div class="tm-pgh">
    <div>
      <h1>Products</h1>
      <div class="meta">
        <span class="live"><span class="pulse"></span>{{ tableInfo.total || 0 }} products</span>
        <span>·</span>
      </div>
    </div>
    <a class="tm-btn pri" [routerLink]="['/admin-panel/products/add']">
      <span>+ New product</span>
    </a>
  </div>

  <div class="tm-bar">
    <label class="tm-bar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
      <input
        type="text"
        placeholder="Search by ID or name…"
        [(ngModel)]="search"
        (keyup)="applySearch(search)"
      >
    </label>
    <span class="chip" [class.on]="!filters.category" (click)="selectCategory(null)">All</span>
    <span
      class="chip"
      *ngFor="let category of categories"
      [class.on]="filters.category === category.id"
      (click)="selectCategory(category.id)"
    >{{ category.name }}</span>
    <span class="sep"></span>
    <span class="chip" [class.on]="!!filters.stock" (click)="cycleStock()">stock: <b>{{ stockLabel }}</b></span>
    <div class="right">
      <button class="tm-btn" type="button" (click)="clearFilters()" *ngIf="hasActiveFilters">
        <mat-icon style="font-size:14px;width:14px;height:14px;line-height:14px">filter_alt_off</mat-icon>
        Clear
      </button>
    </div>
  </div>

  <app-products-table
    [filters]="filters"
    (filterChange)="onTableFilterChange($event)">
  </app-products-table>
</div>
