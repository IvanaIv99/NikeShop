<header class="cu-shop-head">
  <div>
    <div class="mlabel">// catalogue · ss26</div>
    <h1>All sneakers <span class="count">· {{ total }} styles</span></h1>
  </div>
  <button class="sort" type="button" [matMenuTriggerFor]="sortMenu">
    <span>sort by</span> <b>{{ sortLabel }}</b>
    <svg class="caret" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <mat-menu #sortMenu="matMenu" class="cu-sort-menu" xPosition="before">
    <button mat-menu-item type="button" *ngFor="let option of sortOptions" (click)="setSort(option.value)" [class.on]="sort === option.value">
      {{ option.label }}
    </button>
  </mat-menu>
</header>

<div class="cu-shop-bar">
  <div class="lbl">filter</div>
  <label class="cu-search-input">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
    <input type="text" placeholder="Search products…" [ngModel]="searchTerm" (ngModelChange)="onSearchChange($event)">
  </label>
  <span class="chip" [class.on]="!selectedCategoryId" (click)="selectCategory(null)">all <b>· {{ total }}</b></span>
  <span
    class="chip"
    *ngFor="let category of categories"
    [class.on]="selectedCategoryId === category.id"
    (click)="selectCategory(category.id)"
  >{{ category.name }}</span>
</div>

<app-product-list
  [products]="products"
  (productAdded)="addProductToCart($event)">
</app-product-list>

<div *ngIf="hasMore" style="text-align:center;padding:32px">
  <button class="chip" type="button" (click)="loadMore()" [disabled]="loading">
    {{ loading ? 'Loading…' : 'Load more' }}
  </button>
</div>
