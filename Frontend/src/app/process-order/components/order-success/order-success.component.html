<section class="os-wrap">
  <div class="os-inner" role="status" aria-live="polite">
    <div class="os-check" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7" />
      </svg>
    </div>

    <h1 class="os-title">Order confirmed</h1>
    <p class="os-subtitle">
      Thank you for your trust. Your order has been recorded and will be processed shortly.
    </p>

    <div class="os-order">
      <span class="os-order__label">Order</span>
      <span class="os-order__value">#{{ orderId }}</span>
    </div>

    <div class="os-actions">
      <a routerLink="/shop" class="os-btn os-btn--primary">Continue shopping</a>
      <a routerLink="/home" class="os-btn os-btn--ghost">Back to home <span class="os-arrow">&rarr;</span></a>
    </div>
  </div>
</section>
